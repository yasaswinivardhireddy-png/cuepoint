# Daily delivery report: yesterday's impressions per campaign against its goal, as CSV in S3.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cuepoint-report
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  labels:
    app.kubernetes.io/name: report
spec:
  schedule: "15 0 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: report
        spec:
          serviceAccountName: cuepoint-report
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: report
              image: cuepoint/reporting:dev
              command: ["cuepoint-report"]
              envFrom:
                - configMapRef:
                    name: cuepoint-env
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
