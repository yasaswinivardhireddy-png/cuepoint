# Impression worker (Python). Competing consumers on the SQS queue; conditional writes in DynamoDB
# make every impression count exactly once, however many replicas run and however often SQS
# redelivers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cuepoint-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: cuepoint-worker
      automountServiceAccountToken: false
      # SIGTERM lets the current batch finish; a long poll lasts at most WAIT_SECONDS.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: cuepoint/reporting:dev
          ports:
            - name: metrics
              containerPort: 9102
          envFrom:
            - configMapRef:
                name: cuepoint-env
          env:
            - name: WAIT_SECONDS
              value: "10"
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
