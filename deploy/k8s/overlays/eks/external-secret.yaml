# Secrets live in AWS Secrets Manager (key cuepoint/prod, a JSON object with JWT_SECRET,
# INTERNAL_API_TOKEN, BEACON_SECRET and DEMO_PASSWORD); External Secrets Operator syncs them into
# the cuepoint-secrets Secret the pods read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cuepoint-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: cuepoint-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cuepoint/prod
