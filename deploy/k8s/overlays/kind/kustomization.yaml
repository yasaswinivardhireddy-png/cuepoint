# Local cluster and CI: kind, with moto standing in for AWS (deploy/kind/aws-emulator.yaml).
# scripts/e2e-kind.sh builds the images, writes secrets.env and applies this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: cuepoint/api
    newTag: local
  - name: cuepoint/adserver
    newTag: local
  - name: cuepoint/reporting
    newTag: local
  - name: cuepoint/web
    newTag: local

configMapGenerator:
  - name: cuepoint-env
    behavior: merge
    literals:
      - AWS_ENDPOINT_URL=http://moto.cuepoint-aws:5000
      # moto accepts any credentials; on EKS, pods get real ones through IRSA instead.
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - CAMPAIGNS_TABLE=cuepoint-local-campaigns
      - DELIVERY_TABLE=cuepoint-local-delivery
      - PROCESSED_EVENTS_TABLE=cuepoint-local-processed-events
      - REPORTS_BUCKET=cuepoint-local-delivery-reports-123456789012
      - EVENTS_QUEUE_URL=http://moto.cuepoint-aws:5000/123456789012/cuepoint-local-ad-events
      - PUBLIC_BASE_URL=http://localhost:8080/ads

# Random values, generated by scripts/e2e-kind.sh (see secrets.env.example); never committed.
# A fixed name, because the base Deployments refer to it by name.
secretGenerator:
  - name: cuepoint-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

patches:
  # kind maps host port 8080 to this NodePort (deploy/kind/cluster.yaml).
  - target:
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # Demo users and campaigns for the browser tests.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: SEED_DEMO
                    value: "true"
