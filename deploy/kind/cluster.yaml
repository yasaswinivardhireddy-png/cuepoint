# One node; host ports reach the web edge and the AWS emulator.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cuepoint
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080 # web (nginx edge)
        hostPort: 8080
        listenAddress: 127.0.0.1
      - containerPort: 30500 # moto, for Terraform and for checking results
        hostPort: 5000
        listenAddress: 127.0.0.1
